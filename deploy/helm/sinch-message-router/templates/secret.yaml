{{- if .Values.secrets.create }}
{{- if .Values.secrets.externalSecrets.enabled }}
# -------------------------------------------------------
# ExternalSecret - syncs from AWS Secrets Manager
# -------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "sinch-message-router.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sinch-message-router.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "sinch-message-router.secretName" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          {{- include "sinch-message-router.labels" . | nindent 10 }}
  data:
    - secretKey: SINCH_PROJECT_ID
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.remoteRef.key }}
        property: project_id
    - secretKey: SINCH_API_KEY_ID
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.remoteRef.key }}
        property: api_key_id
    - secretKey: SINCH_API_KEY_SECRET
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.remoteRef.key }}
        property: api_key_secret
    - secretKey: SINCH_SERVICE_PLAN_ID
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.remoteRef.key }}
        property: service_plan_id
    - secretKey: SINCH_API_TOKEN
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.remoteRef.key }}
        property: api_token
{{- else }}
# -------------------------------------------------------
# Kubernetes Secret - inline credentials
# WARNING: For production, use external-secrets-operator
# or sealed-secrets instead of inline values.
# -------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sinch-message-router.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sinch-message-router.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
