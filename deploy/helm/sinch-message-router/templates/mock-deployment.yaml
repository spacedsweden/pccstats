{{- if .Values.mockServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sinch-message-router.mockFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sinch-message-router.mockLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mockServer.replicaCount }}
  selector:
    matchLabels:
      {{- include "sinch-message-router.mockSelectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "sinch-message-router.mockLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock-server
          image: "{{ .Values.mockServer.image.repository }}:{{ .Values.mockServer.image.tag }}"
          imagePullPolicy: {{ .Values.mockServer.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.mockServer.service.port }}
              protocol: TCP
          env:
            - name: MOCK_LATENCY_MS
              value: {{ .Values.mockServer.latencyMs | quote }}
            - name: MOCK_ERROR_RATE
              value: {{ .Values.mockServer.errorRate | quote }}
            - name: MOCK_RESPONSE_SIZE
              value: {{ .Values.mockServer.responseSize | quote }}
            - name: MOCK_PORT
              value: {{ .Values.mockServer.service.port | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mockServer.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sinch-message-router.mockFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sinch-message-router.mockLabels" . | nindent 4 }}
spec:
  type: {{ .Values.mockServer.service.type }}
  ports:
    - port: {{ .Values.mockServer.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "sinch-message-router.mockSelectorLabels" . | nindent 4 }}
{{- end }}
