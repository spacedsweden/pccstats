apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sinch-message-router.configmapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sinch-message-router.labels" . | nindent 4 }}
data:
  yarp-routes.json: |
    {{- .Values.config.yarpRoutes | nindent 4 }}
  channel-mapping.json: |
    {{- .Values.config.channelMapping | nindent 4 }}
  rate-limiting.json: |
    {{- .Values.config.rateLimiting | nindent 4 }}
---
{{- if and .Values.otel.enabled .Values.otel.sidecar.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sinch-message-router.fullname" . }}-otel-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sinch-message-router.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      {{- toYaml .Values.otel.sidecar.config.receivers | nindent 6 }}
    processors:
      {{- toYaml .Values.otel.sidecar.config.processors | nindent 6 }}
    exporters:
      {{- toYaml .Values.otel.sidecar.config.exporters | nindent 6 }}
    service:
      {{- toYaml .Values.otel.sidecar.config.service | nindent 6 }}
{{- end }}
