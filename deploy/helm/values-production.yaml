# -----------------------------------------------------------------------------
# Sinch MessageRouter Gateway - Production Overrides
# -----------------------------------------------------------------------------
# Usage:
#   helm upgrade --install sinch-message-router ./sinch-message-router \
#     -n sinch-production \
#     -f sinch-message-router/values.yaml \
#     -f values-production.yaml
# -----------------------------------------------------------------------------

replicaCount: 5

image:
  pullPolicy: IfNotPresent
  # tag: "1.0.0"  # Pin to a specific version in production

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/sinch-message-router-production

# -- Stricter resource limits for production
resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "1Gi"
    cpu: "2000m"

# -- Production ingress configuration
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:123456789012:certificate/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/group.name: sinch-message-router-prod
    alb.ingress.kubernetes.io/load-balancer-attributes: >-
      idle_timeout.timeout_seconds=60,
      routing.http.drop_invalid_header_fields.enabled=true,
      routing.http2.enabled=true,
      access_logs.s3.enabled=true,
      access_logs.s3.bucket=sinch-alb-logs-production,
      access_logs.s3.prefix=message-router
    alb.ingress.kubernetes.io/shield-advanced-protection: "true"
    alb.ingress.kubernetes.io/wafv2-acl-arn: "arn:aws:wafv2:us-east-1:123456789012:regional/webacl/sinch-production/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    alb.ingress.kubernetes.io/tags: >-
      Environment=production,
      Service=sinch-message-router,
      ManagedBy=helm,
      CostCenter=messaging-platform
  hosts:
    - host: message-router.your-domain.com
      paths:
        - path: /
          pathType: Prefix

# -- Production autoscaling: higher minimums, aggressive scale-up
autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 100
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75
  customMetrics:
    enabled: true
    requestsPerSecond: 800
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 15
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 900
      policies:
        - type: Percent
          value: 5
          periodSeconds: 120
      selectPolicy: Min

# -- Stricter PDB for production
podDisruptionBudget:
  enabled: true
  minAvailable: 3

# -- Production probes: tighter thresholds
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2
  successThreshold: 1

# -- Require spreading across AZs in production
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - sinch-message-router
        topologyKey: topology.kubernetes.io/zone

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels: {}
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels: {}

# -- Production environment variables
env:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  LOG_LEVEL: "Warning"
  SINCH_API_BASE_URL: "https://us.sms.api.sinch.com"
  SINCH_REGION: "us"
  ENABLE_REQUEST_BUFFERING: "true"
  REQUEST_TIMEOUT_SECONDS: "30"
  RETRY_COUNT: "3"
  CIRCUIT_BREAKER_FAILURE_THRESHOLD: "5"
  CIRCUIT_BREAKER_RECOVERY_SECONDS: "30"

# -- Use external-secrets for production credentials
secrets:
  create: true
  externalSecrets:
    enabled: true
    secretStoreRef:
      name: aws-secrets-manager
      kind: ClusterSecretStore
    refreshInterval: "15m"
    remoteRef:
      key: "/production/sinch/message-router/api-credentials"

# -- OpenTelemetry with external collector in production
otel:
  enabled: true
  collectorEndpoint: "http://otel-collector.observability.svc.cluster.local:4317"
  serviceName: "sinch-message-router"
  sidecar:
    enabled: false

# -- Enable ServiceMonitor in production
serviceMonitor:
  enabled: true
  additionalLabels:
    release: prometheus
  interval: "15s"
  scrapeTimeout: "10s"

# -- Mock server MUST be disabled in production
mockServer:
  enabled: false

# -- Production-tuned rate limiting
config:
  rateLimiting: |
    {
      "RateLimiting": {
        "EnableRateLimiting": true,
        "GlobalRateLimit": {
          "PermitLimit": 50000,
          "Window": "00:01:00",
          "QueueLimit": 2000,
          "QueueProcessingOrder": "OldestFirst"
        },
        "PerClientRateLimit": {
          "PermitLimit": 5000,
          "Window": "00:01:00",
          "QueueLimit": 200,
          "SegmentSize": 10,
          "TokenLimit": 5000,
          "ReplenishmentPeriod": "00:00:10",
          "TokensPerPeriod": 500
        },
        "PerEndpointRateLimits": {
          "/api/v1/sms/*": {
            "PermitLimit": 25000,
            "Window": "00:01:00"
          },
          "/api/v1/mms/*": {
            "PermitLimit": 10000,
            "Window": "00:01:00"
          },
          "/api/v1/conversation/*": {
            "PermitLimit": 15000,
            "Window": "00:01:00"
          }
        }
      }
    }
