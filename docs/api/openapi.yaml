  # ─────────────────────────────────────────────
  # Templates
  # ─────────────────────────────────────────────
  /v1/templates:
    post:
      operationId: createTemplate
      summary: Create a message template
      description: |
        Create a reusable message template with parameterized placeholders.
        Templates are required for WhatsApp Business API initiated conversations
        and can be used on any channel to standardize message content.

        Parameters are referenced in the template body using double curly braces:
        `{{parameter_name}}`.
      tags:
        - Templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreateRequest'
            example:
              name: "order_shipped"
              description: "Notify customer that their order has shipped"
              channel: whatsapp
              language: "en"
              content:
                type: text
                text: "Hi {{customer_name}}, your order {{order_id}} has been shipped! Track it here: {{tracking_url}}"
              parameters:
                - name: customer_name
                  description: "Customer's first name"
                  example: "Jane"
                - name: order_id
                  description: "Order identifier"
                  example: "ORD-98765"
                - name: tracking_url
                  description: "Package tracking URL"
                  example: "https://example.com/track/1234"
      responses:
        "201":
          description: Template created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          description: A template with this name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: listTemplates
      summary: List templates
      description: Retrieve a paginated list of message templates.
      tags:
        - Templates
      parameters:
        - name: channel
          in: query
          description: Filter templates by channel.
          schema:
            $ref: '#/components/schemas/Channel'
        - name: status
          in: query
          description: Filter templates by approval status.
          schema:
            type: string
            enum:
              - pending
              - approved
              - rejected
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        "200":
          description: A paginated list of templates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateList'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /v1/templates/{templateId}:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    get:
      operationId: getTemplate
      summary: Get a template
      description: Retrieve full details for a single message template.
      tags:
        - Templates
      responses:
        "200":
          description: Template details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
