        "500":
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: updateTemplate
      summary: Update a template
      description: |
        Partially update a message template. Updating the content of an approved
        WhatsApp template will require re-approval.
      tags:
        - Templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateUpdateRequest'
      responses:
        "200":
          description: Template updated.
          content:
            application/json:
